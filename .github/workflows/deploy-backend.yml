name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d /opt/guesthouse-api ]; then
              git clone https://github.com/tothadi/guesthouse.git /opt/guesthouse-api
            fi
            cd /opt/guesthouse-api
            git pull origin main
            cd backend
            docker build --build-arg PORT=${{ secrets.PORT }} -t guesthouse-api .
            docker stop guesthouse-api || true
            docker rm guesthouse-api || true
            docker run -d \
              --name guesthouse-api \
              --restart always \
              -p "${{ secrets.PORT }}":"${{ secrets.PORT }}" \
              -e PORT="${{ secrets.PORT }}" \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              guesthouse-api
            docker image prune -f
